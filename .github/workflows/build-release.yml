name: build-release

# 推一个 v* 的 tag 就自动构建 + 打包 + 发布。
# 上传发生在 GitHub 自己的机房，不占用本地带宽。
#
# 手动验证（不发布，只构建并留存产物）：
#   gh workflow run build-release -f publish=false

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '是否发布到 Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install sherpa-onnx sounddevice keyboard numpy pyinstaller

      - name: 下载 SenseVoice 模型
        run: powershell -ExecutionPolicy Bypass -File download-model.ps1

      - name: PyInstaller 打包
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --console --name voice-f9 `
            --collect-all sherpa_onnx `
            --collect-all sounddevice `
            --hidden-import keyboard `
            --exclude-module faster_whisper `
            --exclude-module ctranslate2 `
            --exclude-module av `
            --exclude-module torch `
            --exclude-module transformers `
            --exclude-module tokenizers `
            --exclude-module onnxruntime `
            voice_f9.py

      - name: 组装并压缩
        shell: pwsh
        run: |
          Copy-Item config.json dist\voice-f9\
          Copy-Item start-voice-f9.vbs dist\voice-f9\
          Copy-Item install-autostart.ps1 dist\voice-f9\
          New-Item -ItemType Directory -Force dist\voice-f9\models | Out-Null
          Copy-Item models\sensevoice dist\voice-f9\models\ -Recurse
          Compress-Archive -Path dist\voice-f9 -DestinationPath voice-f9-win64.zip -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item voice-f9-win64.zip).Length / 1MB, 0)
          Write-Host "包体积: $mb MB"
          (Get-FileHash voice-f9-win64.zip -Algorithm SHA256).Hash | Out-File voice-f9-win64.zip.sha256 -Encoding ascii

      - name: 留存产物（手动运行时用）
        uses: actions/upload-artifact@v4
        with:
          name: voice-f9-win64
          path: voice-f9-win64.zip
          retention-days: 7

      - name: 发布到 Release（仅 tag 或 publish=true）
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            voice-f9-win64.zip
            voice-f9-win64.zip.sha256
          generate_release_notes: true