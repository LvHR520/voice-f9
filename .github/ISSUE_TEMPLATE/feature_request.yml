name: 提个想法
description: 想要的功能、改进建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scene
    attributes:
      label: 你想在什么场景下用它
      description: 说场景比说功能更有用——同样一句话，不同场景下做法可能完全不同
      placeholder: 我在写代码时想边说边出现注释，不想切窗口
    validations:
      required: true

  - type: textarea
    id: now
    attributes:
      label: 现在卡在哪
      description: 目前你是怎么做的，哪里不舒服
    validations:
      required: false

  - type: textarea
    id: idea
    attributes:
      label: 你希望的解法
      description: 有想法就写，没有也行
    validations:
      required: false